<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="shortcut icon" href="../../midia/ico/ico-aba.png" type="image/x-icon">
    <title> Fitness Routine - Dashboard </title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" 
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" 
        crossorigin="anonymous" 
        referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

    <div class="barra_lateral" id="barraLateral">
        <img src="../../midia/logo-dash.png" alt="logo-dash"><br><br>
        <a href="../inicio/dashboard.html" class="link">Início</a>
        <a href="../planilhas/dashboard.html" class="link">Treinos</a>
        <a href="../curiosidades/dashboard.html" class="link">Curiosidades</a>
        <a href="../sobre/dashboard.html" class="link">Sobre</a>
    </div>

<div class="main" id="mainContent">
        <div class="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active" data-card="1">
                    <img src="../../midia/cur/img-cur1.jpg" alt="Imagem 1">
                </div>

                <div class="carousel-item" data-card="2">
                    <img src="../../midia/cur/img-cur2.jpg" alt="Imagem 2">
                </div>

                <div class="carousel-item" data-card="3">
                    <img src="../../midia/cur/img-cur3.jpg" alt="Imagem 3">
                </div>

                <div class="carousel-item" data-card="4">
                    <img src="../../midia/cur/img-cur4.jpg" alt="Imagem 4">
                </div>

                <div class="carousel-item" data-card="5">
                    <img src="../../midia/cur/img-cur5.jpg" alt="Imagem 5">
                </div>

            </div>

            <button class="prev">&#10094;</button>
            <button class="next">&#10095;</button>
        </div>

        <div class="card" id="dynamicCard">
            <div class="card-content">
                <h2 id="card-title"></h2>
                <p id="card-text"></p>
                <a href="#" class="btn" id="card-link"></a>
            </div>
        </div>
</div>

<div class="modal-overlay" id="modalOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ConfigModal">
    <button class="modal-fechar" id="fecharModal" aria-label="Fechar"><i class="fa-solid fa-x"></i></button>
    <h2 id="tituloModal">Configurações de usuário</h2>

    <form id="formPreferencias">
      <div class="modal-grid">
        <div class="col-inputs">
          <div class="grupo">
            <label for="username">Usuario: </label>
            <input type="text" id="username" name="username"/>
          </div>

          <div class="grupo">
            <label for="email">Email: </label>
            <input type="mail" id="email" name="email"/>
          </div>

          <div class="grupo">
            <label for="senha">Senha: </label>
            <input type="password" id="senha" name="senha"/>
          </div>
        </div>
      </div>

      <div class="acoes">
        <button type="button" class="btn-secundario" id="cancelarModal">Cancelar</button>
        <button type="submit" class="btn-primario">Salvar configurações</button>
      </div>
    </form>
  </div>
</div>

<div class="botoes-fixos">
    <button class="toggle-btn" onclick="alternarBarra(), removerFixos()">
      <i class="fas fa-bars"></i>
    </button>

    <button class="toggle-btn" id="btn-logout">
      <a href="../../inicio-pg/inicio.html" class="btn-fixo">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>
    </button>

    <button class="toggle-btn" id="btn-user">
        <i class="fas fa-user"></i>
    </button>

</div>

<script src="dashboard.js"></script>
</body>
</html>
